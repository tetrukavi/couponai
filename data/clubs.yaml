# Loyalty clubs checked during a paid "Search online" (one AI web search each, ~$0.04).
# The AI only sees public pages (it can't log in to the club apps).
# A private data/clubs.local.yaml (gitignored) or the COUPONAI_CLUBS env var overrides this file.
# connector:
#   public_web          -> searches the club's publicly accessible benefit pages
#   mock_authenticated  -> placeholder for an SMS-OTP portal (later: persistent Playwright session)
clubs:
  - id: poalim_wonder
    name: Poalim Wonder
    search_hint: "פועלים וונדר Poalim Wonder (Bank Hapoalim club) הטבות, שוברים ומבצעים; bankhapoalim.co.il/poalim-wonder"
    connector: public_web
    enabled: true
  - id: cal
    name: Cal
    search_hint: "כאל Cal credit card הטבות למחזיקי כרטיס (Cal365, CalExtra, הנחות בבתי עסק); cal-online.co.il"
    connector: public_web
    enabled: true
