# Multi-store gift-card networks -> stores that (probably) accept them.
# `stores` is SEED DATA, UNVERIFIED. Where a network publishes its official merchant list,
# `catalog` points to it: couponAI downloads it monthly and it overrides `stores`
# (see app/catalogs.py). Other networks are confirmed by the store-site web search.
networks:
  - name: BuyMe ALL
    aliases: [ביימי, BuyMe, ביי מי, ביימי אול, BUYME ALL]
    buy: {where: BuyMe, url: "https://buyme.co.il/supplier/13438757"}
    catalog: {provider: buyme, id: 13438757}
    stores: [Foot Locker, Nike, Adidas, Castro, Fox, Terminal X, Golf, Renuar, American Eagle, Super-Pharm, KSP, IKEA, ACE, Home Center]
  - name: BuyMe Fashion
    aliases: [ביימי אופנה, BuyMe Fashion & Beauty, BUYME FASHION & BEAUTY]
    buy: {where: BuyMe, url: "https://buyme.co.il/supplier/20620"}
    catalog: {provider: buyme, id: 20620}
    stores: [Foot Locker, Nike, Adidas, Castro, Fox, Terminal X, Golf, Renuar, American Eagle]
  - name: Max Gift Card
    aliases: [מקס גיפט קארד, כרטיס מתנה מקס]
    buy: {where: Max, url: "https://www.max.co.il/cards/giftcards"}
    stores: [Foot Locker, Nike, Castro, Fox, Super-Pharm, Shufersal, ACE, Home Center]
  - name: תו הזהב
    aliases: [Tav Hazahav, תו זהב]
    stores: [Castro, Fox, Golf, Super-Pharm, ACE, Home Center, Max Stock]
